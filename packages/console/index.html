<!doctype html>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BrowserMind 控制台 — Browser AI Worker Runtime</title>

      Standalone page. `npm run console:build` inlines the stylesheet and the
      bundle below into one self-contained HTML file (`build/console/console.html`)

      page out at `/` with no static folder, no CDN and no extension popup.

  </head>

  </body>
</html>
