<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BrowserMind</title>
    <style>
      :root { color-scheme: dark; }
      body { width: 380px; margin: 0; background: #0b0f19; color: #e6ebf5; font: 13px/1.45 ui-sans-serif, system-ui, sans-serif; }
      header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid #26304a; }
      header strong { font-size: 13px; }
      header .dot { width: 8px; height: 8px; border-radius: 50%; background: #ff6b6b; }
      header .dot.on { background: #3ddc97; }
      main { padding: 12px 14px; display: grid; gap: 12px; }
      h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #8b98b4; margin: 0 0 6px; }
      .card { border: 1px solid #26304a; background: #131a2a; border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; }
      .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .pill { border: 1px solid #26304a; border-radius: 999px; padding: 1px 8px; font-size: 11px; color: #8b98b4; }
      .pill.ready { color: #3ddc97; } .pill.busy { color: #6d8cff; } .pill.blocked { color: #ff6b6b; }
      .muted { color: #8b98b4; font-size: 11.5px; word-break: break-all; }
      button { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid #26304a; background: #1b2436; color: #e6ebf5; cursor: pointer; }
      button.primary { background: #6d8cff; border-color: transparent; color: #08101f; font-weight: 600; }
      button:disabled { opacity: .5; }
      textarea { width: 100%; min-height: 58px; background: #1b2436; border: 1px solid #26304a; border-radius: 8px; color: inherit; padding: 6px; font: inherit; resize: vertical; }
      pre { background: #131a2a; border: 1px solid #26304a; border-radius: 8px; padding: 8px; font-size: 11.5px; max-height: 160px; overflow: auto; white-space: pre-wrap; }
      .empty { color: #8b98b4; font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <span class="dot" id="dot"></span>
      <strong>BrowserMind</strong>
      <span class="pill" id="bridge">runtime: …</span>
      <button id="reconnect" style="margin-left:auto">Reconnect</button>
    </header>
    <main>
      <section>
        <h2>Workers</h2>
        <div id="workers"><div class="empty">No workers.</div></div>
      </section>
      <section>
        <h2>Provider tabs</h2>
        <div id="sessions"><div class="empty">No attached pages.</div></div>
      </section>
      <section>
        <h2>Ask a worker</h2>
        <textarea id="message" placeholder="Analyse this project"></textarea>
        <div class="row" style="margin-top:6px">
          <button class="primary" id="send">Send</button>
          <button id="highlight">Highlight composer</button>
        </div>
        <pre id="answer" hidden></pre>
      </section>
      <section>
        <h2>Open a provider</h2>
        <div class="row" id="providers"></div>
      </section>
      <section>
        <div class="row">
          <button id="options">Settings &amp; plugins</button>
          <button id="reload-all">Reload tabs</button>
        </div>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
