name: Release

# Tag-driven release pipeline.
#
# Pushing a `v*` tag (e.g. `v0.1.0`) runs the full verification checklist,
# packages every plugin folder + builds & zips the extension, then creates a
# GitHub Release on the tag with two versioned assets:
#
#   browsermind-plugins-v0.1.0.zip   ← all packaged plugins (build/plugins/.zips)
#   browsermind-v0.1.0-chrome.zip    ← the Chrome extension (wxt zip)
#
# Regular pushes and PRs are covered by ci.yml; tags are handled only here so
# the two workflows never double-run.
#
# Usage:
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release + upload assets

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  release:
    name: Verify, package & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (runs plugins:sync)
        run: npm ci

      - name: Check tag matches package.json version
        run: |
          TAG='${{ github.ref_name }}'
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Run the full verification checklist
        run: npm run verify

      - name: Package all plugins (with zips)
        run: npm run plugins:build:zip

      - name: Build + zip the extension
        run: npm run ext:zip

      - name: Stage versioned release assets
        run: |
          TAG='${{ github.ref_name }}'
          mkdir -p release-assets
          cp build/plugins/.zips/browsermind-plugins.zip \
             "release-assets/browsermind-plugins-${TAG}.zip"
          cp packages/extension/.output/browsermind-chrome.zip \
             "release-assets/browsermind-${TAG}-chrome.zip"
          ls -l release-assets

      - name: Create GitHub Release with assets
        uses: softprops/action-gh-release@v2
        with:
          name: BrowserMind ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
